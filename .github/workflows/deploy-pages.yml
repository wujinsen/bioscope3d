# Deploy monorepo to GitHub Pages (https://<owner>.github.io/<repo>/).
# Repo → Settings → Pages → Source: GitHub Actions.

name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync GLB models into public/
        run: pnpm sync:models

      - name: Verify cell GLBs for Pages
        run: node scripts/verify-pages-models.mjs

      - name: Build and assemble site
        env:
          CI: true
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          PAGES_CUSTOM_DOMAIN: bioscope3d.wu-jinsen.com
        run: node scripts/build-github-pages.mjs

      - name: Verify artifact
        run: |
          test -f page-dist/index.html
          test -f page-dist/studio/index.html
          test -f page-dist/heritage/index.html
          ls -la page-dist/studio/models/
          du -sh page-dist/studio/models/
          COUNT=$(find page-dist/studio/models -name '*.glb' -size +100k | wc -l)
          echo "GLB files over 100KB in artifact: $COUNT (expected 7)"
          test "$COUNT" -eq 7

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: page-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
